<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>WWDC Live</title>
  <link rel="stylesheet" href="style.css?v=16" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%8E%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
</head>
<body>
  <!-- Ambient visionOS-style environment light behind the glass -->
  <div id="ambient" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <div id="grain" aria-hidden="true"></div>

  <div id="app" class="no-chat">
    <!-- Video / stage -->
    <main id="stage">
      <video id="video" autoplay muted playsinline disablepictureinpicture></video>

      <!-- Standby screen. Starts as a neutral loader until session state is known,
           then JS swaps in the live / recording / countdown card. -->
      <div id="standby">
        <div class="loader" role="status" aria-label="Loading"></div>
      </div>

      <!-- Session switcher (Keynote / Platforms State of the Union …) -->
      <div id="tabs" class="tabs" role="tablist" aria-label="Sessions"></div>

      <!-- Floating reactions render here -->
      <div id="reaction-layer" aria-hidden="true"></div>

      <!-- Top bar overlay -->
      <div id="topbar">
        <div class="live-badge"><span class="live-dot"></span> LIVE</div>
        <div class="viewers" id="viewers" title="People watching">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-5 0-9 2.5-9 6v2h18v-2c0-3.5-4-6-9-6Z"/></svg>
          <span id="viewer-count">1</span>
        </div>
        <button id="admin-chat" class="admin-toggle" type="button">💬 Show chat</button>
      </div>

      <!-- Minimal controls: unmute + volume + fullscreen (no playback/seek) -->
      <button id="unmute" class="pill">🔊 Tap for sound</button>
      <div id="volume" class="volume" aria-label="Volume">
        <button id="vol-btn" class="vol-btn" type="button" aria-label="Mute"></button>
        <input id="vol-slider" class="vol-slider" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume" />
      </div>
      <button id="fullscreen" class="icon-btn" title="Fullscreen" aria-label="Toggle fullscreen">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M4 9V4h5v2H6v3H4Zm11-5h5v5h-2V6h-3V4ZM4 15h2v3h3v2H4v-5Zm14 3v-3h2v5h-5v-2h3Z"/></svg>
      </button>

      <!-- Reopen chat (shown when collapsed) with unread badge -->
      <button id="chat-toggle" class="icon-btn" title="Open chat" aria-label="Open chat">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/></svg>
        <span id="chat-badge" class="badge"></span>
      </button>
    </main>

    <!-- Chat panel -->
    <aside id="chat" class="open">
      <header class="chat-head">
        <h2>Live Chat</h2>
        <span id="me" class="me"></span>
        <button id="clear-chat" class="collapse-btn clear-btn" title="Clear chat (host only)" aria-label="Clear chat">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M9 3h6l1 2h4v2H4V5h4l1-2Zm-3 6h12l-1 12H7L6 9Zm4 2v7h1v-7H10Zm3 0v7h1v-7h-1Z"/></svg>
        </button>
        <button id="chat-collapse" class="collapse-btn" title="Collapse chat" aria-label="Collapse chat">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M9.29 6.71a1 1 0 0 0 0 1.41L13.17 12l-3.88 3.88a1 1 0 1 0 1.42 1.41l4.59-4.58a1 1 0 0 0 0-1.42L10.71 6.7a1 1 0 0 0-1.42 0Z"/></svg>
        </button>
      </header>
      <nav class="links" aria-label="Helpful WWDC links">
        <a class="link-chip" href="https://developer.apple.com/wwdc26/" target="_blank" rel="noopener noreferrer">🎟️ WWDC26</a>
        <a class="link-chip" href="https://developer.apple.com/videos/wwdc2026/" target="_blank" rel="noopener noreferrer">▶️ Sessions</a>
        <a class="link-chip" href="https://developer.apple.com/download/" target="_blank" rel="noopener noreferrer">⬇️ Downloads</a>
        <a class="link-chip" href="https://developer.apple.com/news/" target="_blank" rel="noopener noreferrer">📰 News</a>
        <a class="link-chip" href="https://developer.apple.com/documentation/" target="_blank" rel="noopener noreferrer">📚 Docs</a>
        <a class="link-chip" href="https://developer.apple.com/design/human-interface-guidelines/" target="_blank" rel="noopener noreferrer">🎨 HIG</a>
        <a class="link-chip" href="https://developer.apple.com/swift/" target="_blank" rel="noopener noreferrer">🦅 Swift</a>
        <a class="link-chip" href="https://developer.apple.com/forums/" target="_blank" rel="noopener noreferrer">💬 Forums</a>
      </nav>
      <div id="messages" class="messages" aria-live="polite"></div>

      <div class="reactions" id="reaction-bar">
        <button data-emoji="👏">👏</button>
        <button data-emoji="🔥">🔥</button>
        <button data-emoji="❤️">❤️</button>
        <button data-emoji="😂">😂</button>
        <button data-emoji="🎉">🎉</button>
        <button data-emoji="🤯">🤯</button>
      </div>

      <form id="chat-form" class="chat-form" autocomplete="off">
        <input id="chat-input" type="text" maxlength="300" placeholder="Say something…" />
        <button id="send-btn" type="submit" aria-label="Send" disabled>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="m3 3 18 9-18 9 4-9-4-9Zm4.5 9L5 7.6 16.9 12 5 16.4 7.5 12Z"/></svg>
        </button>
      </form>
    </aside>
  </div>

  <script src="backend.js?v=4"></script>
  <script src="app.js?v=16"></script>
</body>
</html>
